services:
  app:
    build: ./app

  # TPS proxies everything Caddy routes to it -- both /protected/* and
  # /static-protected/* -- to Caddy's internal :8081 listener. That listener
  # has no Turnstile rules (so a verified replay does not loop back into a
  # challenge) and is where the per-path routing happens: static files are
  # served directly, everything else goes to the app.
  tps:
    build: ..
    environment:
      GIN_MODE: "release"
      BIND_ADDR: ":8080"
      PROXY_TARGET: "http://caddy:8081"
      DB_PATH: "/var/local/tps/data/tps.db"
    volumes:
      - tps-data:/var/local/tps/data
    # No depends_on: caddy fronts tps and tps proxies back to caddy, so
    # declaring startup order either way would be a cycle. Neither one talks to
    # the other until a request comes in, by which point both are up.

  caddy:
    build: ./caddy
    # SITE_HOST is the address Caddy serves the public HTTPS listener on (see
    # caddy/Caddyfile). Defaults to localhost; override for LAN/IP access with
    # e.g. `SITE_HOST=192.0.2.10 docker compose up` or a *.nip.io name.
    environment:
      SITE_HOST: "${SITE_HOST:-localhost}"
    depends_on:
      - tps
      - app

volumes:
  tps-data: {}
