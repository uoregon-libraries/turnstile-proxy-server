services:
  app:
    build: ./app

  # Single TPS instance fronting two backends:
  #   /protected/*         -> the app
  #   /static-protected/*  -> Caddy's internal :8081 listener, which serves
  #                           static files with no Turnstile rule (so a
  #                           verified replay does not loop back into a
  #                           challenge).
  tps:
    build: ..
    environment:
      GIN_MODE: "release"
      BIND_ADDR: ":8080"
      PROXY_TARGETS: "/protected/=http://app:8080,/static-protected/=http://caddy:8081"
      LOG_DB_PATH: "/var/local/tps/data/tps.db"
    volumes:
      - tps-data:/var/local/tps/data
    depends_on:
      app:
        condition: service_started

  caddy:
    build: ./caddy
    # SITE_HOST is the address Caddy serves the public HTTPS listener on (see
    # caddy/Caddyfile). Defaults to localhost; override for LAN/IP access with
    # e.g. `SITE_HOST=192.0.2.10 docker compose up` or a *.nip.io name.
    environment:
      SITE_HOST: "${SITE_HOST:-localhost}"
    depends_on:
      - tps
      - app

volumes:
  tps-data: {}
