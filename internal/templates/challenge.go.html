<!DOCTYPE html>
<html>
  <head>
    <title>Verifying browser</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>

  <body>
    <h1>Processing...</h1>
    <p>Please wait while we verify you are human.</p>
    <form id="tps-challenge-form" action="{{.PostAction}}" method="POST">
      <input type="hidden" name="request_id" value="{{.RequestID}}" />
      <div class="cf-turnstile" data-sitekey="{{.SiteKey}}" data-callback="onSuccess"></div>
    </form>
    <script>
      // Submit the challenge form by id, not document.querySelector('form'):
      // a custom template may embed other forms (e.g. a site search bar) ahead
      // of this one, and querySelector('form') would submit the wrong one.
      function onSuccess(token) {
        document.getElementById('tps-challenge-form').submit();
      }
    </script>
  </body>
</html>
